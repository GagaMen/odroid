{{- if dig "velero" "enabled" true .Values.AsMap }}
{{- $rustfs := (dig "rustfs" "rustfs" "secret" "rustfs" dict .Values.AsMap) }}
{{- $targets := (dig "velero" "targets" dict .Values.AsMap) }}
{{- $cloud := (get $targets "cloud") | default dict }}
# Velero's credentials file, one profile per BackupStorageLocation. Rendered here
# rather than in the velero chart so the RustFS keys stay in one place: the
# rustfs chart and Velero read the same values.
apiVersion: v1
kind: Secret
metadata:
  name: velero-credentials
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  cloud: |
    [local]
    aws_access_key_id={{ required "rustfs.rustfs.secret.rustfs.access_key is required for the local Velero target" (get $rustfs "access_key") }}
    aws_secret_access_key={{ required "rustfs.rustfs.secret.rustfs.secret_key is required for the local Velero target" (get $rustfs "secret_key") }}
{{- if (get $cloud "enabled") }}
    [cloud]
    aws_access_key_id={{ required "velero.targets.cloud.accessKey is required while the cloud target is enabled" (get $cloud "accessKey") }}
    aws_secret_access_key={{ required "velero.targets.cloud.secretKey is required while the cloud target is enabled" (get $cloud "secretKey") }}
{{- end }}
{{- end }}
