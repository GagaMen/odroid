# Which Helm values come from Bitwarden, and from where.
#
# The structure mirrors platform/values.yaml. Every leaf is a reference to a
# Bitwarden item, matched by its exact name, and one of its fields:
# `username`, `password`, `notes`, or the name of a custom field.
# scripts/secrets-values resolves the references and prints the resulting
# values; scripts/helm-platform passes them to Helm after platform/values.yaml.
#
# This file holds no secrets and is versioned.

clusterIssuer:
  secret:
    auth_username: { item: dns-api, field: username }
    auth_password: { item: dns-api, field: password }

adguard:
  prometheusExporter:
    usernames:
      - { item: adguard, field: username }
    passwords:
      - { item: adguard, field: password }

homepage:
  secretEnv:
    HOMEPAGE_VAR_ADGUARD_USERNAME: { item: adguard, field: username }
    HOMEPAGE_VAR_ADGUARD_PASSWORD: { item: adguard, field: password }

grafana:
  grafana:
    adminUser: { item: grafana, field: username }
    adminPassword: { item: grafana, field: password }

rustfs:
  rustfs:
    secret:
      rustfs:
        access_key: { item: rustfs, field: access_key }
        secret_key: { item: rustfs, field: secret_key }

velero:
  repositoryPassword: { item: velero, field: repositoryPassword }

paperless:
  secret:
    adminUser: { item: paperless, field: username }
    adminPassword: { item: paperless, field: password }
    secretKey: { item: paperless, field: secretKey }
  scanShare:
    password: { item: paperless, field: scanSharePassword }
