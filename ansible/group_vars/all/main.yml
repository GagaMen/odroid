---
# Non-sensitive defaults. Everything that identifies this particular machine --
# domains, addresses, credentials -- lives in the vault outside the repository.

# Repository root, derived from where the inventory sits rather than hardcoded,
# so a clone under any path works. Deliberately not playbook_dir: the playbooks
# under maintenance/ live one level deeper, and that would point at ansible/.
odroid_repo_dir: "{{ inventory_dir | dirname }}"

# The vault holds the captured state: platform/values.yaml, the WireGuard
# configuration, and the versions this host is pinned to. It deliberately lives
# outside the repository -- and is therefore the one artefact a restore does not
# bring along. Back it up separately.
odroid_vault_file: "{{ lookup('env', 'ODROID_VAULT') | default(lookup('env', 'HOME') ~ '/.odroid-secrets/vault.yml', true) }}"

# Units that cannot run on this host. Four are collateral damage from the pinned
# vendor systemd, one asks for a kernel feature this build lacks, and
# ModemManager follows from polkit via Requires=. See roles/host/README.md.
#
# Timers are listed next to their service on purpose: a timer whose service is
# masked still fires and still fails, so masking only the service would trade
# one failed unit for another.
host_masked_units:
  - fwupd.service
  - fwupd-refresh.service
  - fwupd-refresh.timer
  - polkit.service
  - udisks2.service
  - systemd-binfmt.service
  - ModemManager.service

# Snaps held against automatic refresh. A refresh restarts containerd and
# kubelite without warning, which kills the CSI driver while volumes are still
# mounted. core22 is microk8s's base -- refreshing it restarts the snaps using
# it -- and snapd's own refresh restarts snapd.service in one of four daily
# windows. Controlled updates go through maintenance/microk8s-update.yml.
host_snap_holds:
  - microk8s
  - core22
  - snapd

# Mountpoints the host trims itself. Everything else -- notably CSI volumes
# served over iSCSI -- is left to the storage layer that understands the
# replication underneath.
host_fstrim_mountpoints:
  - /
  - /mnt/data

# Where the node_exporter textfile collector reads from. Matches
# StateDirectory= in node-exporter-textfile.service.
host_textfile_dir: /var/lib/prometheus/node-exporter

# Hardware watchdog. The device tree carries the node with status = "disabled"
# while the dw_wdt driver is built in, so only the node needs switching on.
host_watchdog_dt_node: watchdog@feaf0000
host_watchdog_overlay_name: watchdog
host_watchdog_overlay_dir: "/boot/dtbs/{{ ansible_kernel }}/rockchip/overlays/odroidm2"

# MicroK8s addons this platform expects. Enabled idempotently: the role reads
# the current status first instead of calling `enable` blindly.
microk8s_addons:
  - dns
  - ingress
  - cert-manager
  - metrics-server

# Helm release.
platform_release_name: platform
platform_namespace: platform
platform_chart_dir: "{{ odroid_repo_dir }}/platform"
platform_values_file: "{{ odroid_repo_dir }}/platform/values.yaml"

microk8s_kubeconfig: /var/snap/microk8s/current/credentials/client.config
microk8s_helm_binary: /snap/bin/microk8s.helm3
microk8s_kubectl_binary: /snap/bin/microk8s.kubectl
