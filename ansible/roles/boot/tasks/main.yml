# flash-kernel regenerates /boot/boot.scr from /etc/default/flash-kernel, so kernel parameters
# go there and not into boot.scr. These are the ones the regenerated script must carry.
- name: Collect the kernel parameters the boot script must carry
  ansible.builtin.set_fact:
    boot_kernel_parameters: >-
      {{ ['lsm=' ~ boot_lsm]
         + (['systemd.unified_cgroup_hierarchy=1'] if host_vendor_systemd else []) }}

# AppArmor -- see "AppArmor" in roles/host/README.md. An lsm= that is already there is left
# alone, whatever it names.
- name: Make AppArmor the kernel's security module
  become: true
  ansible.builtin.replace:
    path: /etc/default/flash-kernel
    regexp: '^(LINUX_KERNEL_CMDLINE="(?![^"]*\blsm=)[^"]*)"'
    replace: '\1 lsm={{ boot_lsm }}"'
    backup: true
  notify:
    - Regenerate the boot script
    - Note a reboot for AppArmor

# cgroup v2 -- see "cgroup v2" in roles/host/README.md. Only the vendor systemd boots into
# the hybrid layout; current systemd knows nothing else.
- name: Boot into the unified cgroup hierarchy
  become: true
  ansible.builtin.replace:
    path: /etc/default/flash-kernel
    regexp: '^(LINUX_KERNEL_CMDLINE="(?![^"]*systemd\.unified_cgroup_hierarchy=1)[^"]*)"'
    replace: '\1 systemd.unified_cgroup_hierarchy=1"'
    backup: true
  when: host_vendor_systemd
  notify:
    - Regenerate the boot script
    - Note a reboot for cgroup v2

# Hardware watchdog -- see "Deadlock recovery" in roles/host/README.md. Newer kernels ship
# an overlay for it (wdt.dtbo) in their own package, so it survives kernel updates. Older
# ones do not, and get one built from files/watchdog.dts.
- name: Look for the kernel's own watchdog overlay
  ansible.builtin.stat:
    path: "{{ boot_overlay_dir }}/wdt.dtbo"
  register: boot_vendor_overlay

- name: Choose the watchdog overlay
  ansible.builtin.set_fact:
    boot_watchdog_overlay: "{{ 'wdt' if boot_vendor_overlay.stat.exists else 'watchdog' }}"

- name: Install the device tree tools
  become: true
  ansible.builtin.apt:
    name: device-tree-compiler
    state: present

# A dry run on a fresh machine has not installed them yet. A real run always has, and fails
# here rather than touch /boot unchecked.
- name: Look for the device tree tools
  ansible.builtin.stat:
    path: /usr/bin/fdtoverlay
  register: boot_dt_tools

- name: Decide whether the overlay can be checked
  ansible.builtin.set_fact:
    boot_check_overlay: "{{ boot_dt_tools.stat.exists or not ansible_check_mode }}"

# Every overlay is checked against the board's device tree in a scratch directory first, so
# a broken one never reaches /boot.
- name: Create a scratch directory for the overlay
  ansible.builtin.tempfile:
    state: directory
    suffix: .overlay
  register: boot_scratch
  check_mode: false
  changed_when: false

- name: Build the watchdog overlay
  ansible.builtin.command:
    argv: [dtc, -q, -I, dts, -O, dtb, -o, "{{ boot_scratch.path }}/watchdog.dtbo", "{{ role_path }}/files/watchdog.dts"]
  check_mode: false
  changed_when: false
  when: boot_check_overlay and boot_watchdog_overlay == 'watchdog'

- name: Apply the overlay to the board's device tree offline
  ansible.builtin.command:
    argv:
      - fdtoverlay
      - -i
      - /boot/dtb
      - -o
      - "{{ boot_scratch.path }}/merged.dtb"
      - "{{ boot_overlay_dir if boot_vendor_overlay.stat.exists else boot_scratch.path }}/{{ boot_watchdog_overlay }}.dtbo"
  check_mode: false
  changed_when: false
  when: boot_check_overlay

- name: Read the watchdog status from the merged device tree
  ansible.builtin.command:
    argv: [fdtget, "{{ boot_scratch.path }}/merged.dtb", /watchdog@feaf0000, status]
  register: boot_watchdog_status
  check_mode: false
  changed_when: false
  failed_when: boot_watchdog_status.stdout != "okay"
  when: boot_check_overlay

- name: Install the watchdog overlay
  become: true
  ansible.builtin.copy:
    src: "{{ boot_scratch.path }}/watchdog.dtbo"
    dest: "{{ boot_overlay_dir }}/watchdog.dtbo"
    remote_src: true
    mode: "0644"
  when: boot_check_overlay and boot_watchdog_overlay == 'watchdog'
  notify: Note a reboot for the watchdog

- name: Remove the scratch directory
  ansible.builtin.file:
    path: "{{ boot_scratch.path }}"
    state: absent
  check_mode: false
  changed_when: false

# /boot/config.ini has an overlays= line in every section; only the one under [generic] is
# used for normal boots.
- name: Load the watchdog overlay at boot
  become: true
  ansible.builtin.replace:
    path: /boot/config.ini
    after: '\[generic\]'
    before: '\n\['
    regexp: '^(overlays="(?![^"]*\b{{ boot_watchdog_overlay }}\b)[^"]*)"$'
    replace: '\1 {{ boot_watchdog_overlay }}"'
    backup: true
  notify: Note a reboot for the watchdog

- name: Create the systemd manager drop-in directory
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system.conf.d
    state: directory
    mode: "0755"

- name: Let systemd feed the watchdog
  become: true
  ansible.builtin.copy:
    src: etc/systemd/system.conf.d/10-watchdog.conf
    dest: /etc/systemd/system.conf.d/10-watchdog.conf
    mode: "0644"
  notify: Re-execute systemd
