---
# Loads the captured state from the vault and refuses to continue on a partial
# one. The vault lives outside the repository, so this is the seam where a
# restore either has what it needs or stops before touching anything.

- name: Secrets | Look for the vault
  ansible.builtin.stat:
    path: "{{ odroid_vault_file }}"
  register: secrets_vault_stat

- name: Secrets | Fail when the vault is missing
  ansible.builtin.fail:
    msg: |-
      No vault at {{ odroid_vault_file }}.

      This repository carries the shape of the system; the vault carries which
      system it is -- domains, addresses, credentials, and the versions this host
      is pinned to. A restore needs both.

      If a working machine still exists, capture it:
        ansible-playbook capture.yml

      If you are restoring, put the backed-up vault in place first, or point at
      it: ODROID_VAULT=/path/to/vault.yml ansible-playbook site.yml

      If the backup is gone, the Kopia repository password went with it, and
      every Velero backup in both targets is unreadable. Say so out loud before
      starting over -- do not quietly generate a new one.
  when: not secrets_vault_stat.stat.exists

- name: Secrets | Load the vault
  ansible.builtin.include_vars:
    file: "{{ odroid_vault_file }}"
  no_log: true

- name: Secrets | Assert the captured state is complete
  ansible.builtin.assert:
    that:
      - vault_platform_values is defined
      - vault_platform_values | length > 0
      - vault_microk8s_channel is defined
      - vault_k9s_version is defined
    fail_msg: |-
      The vault at {{ odroid_vault_file }} is incomplete. The restore needs all of:
        vault_platform_values  -- present: {{ vault_platform_values is defined and (vault_platform_values | default('') | length > 0) }}
        vault_microk8s_channel -- present: {{ vault_microk8s_channel is defined }}
        vault_k9s_version      -- present: {{ vault_k9s_version is defined }}

      Re-run capture.yml against a working machine, or add the missing keys by
      hand with `ansible-vault edit {{ odroid_vault_file }}`.
    success_msg: "vault loaded from {{ odroid_vault_file }}"

# WireGuard is optional: a rebuilt host may legitimately come up without it,
# and half a tunnel configuration is worse than none.
- name: Secrets | Record whether WireGuard was captured
  ansible.builtin.set_fact:
    wireguard_configured: "{{ vault_wireguard_conf is defined and (vault_wireguard_conf | default('')) | length > 0 }}"

- name: Secrets | Report what was found
  ansible.builtin.debug:
    msg: >-
      platform values: {{ (vault_platform_values | length) }} bytes;
      microk8s channel {{ vault_microk8s_channel }};
      k9s {{ vault_k9s_version }};
      WireGuard {{ wireguard_configured | bool | ternary('configured', 'not captured -- role will be skipped') }}
