---
- name: Reload systemd
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true

# Units killed by seccomp stay in the failed state after the cause is fixed, and
# a failed unit keeps the "failed units" alert red for no reason.
- name: Clear failed logging units
  become: true
  ansible.builtin.command:
    cmd: systemctl reset-failed rsyslog.service syslog.socket fstrim.service
  changed_when: false
  failed_when: false

- name: Restart rsyslog
  become: true
  ansible.builtin.systemd_service:
    name: rsyslog.service
    state: restarted

- name: Restart journald
  become: true
  ansible.builtin.systemd_service:
    name: systemd-journald.service
    state: restarted

- name: Apply sysctl settings
  become: true
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: true

# Picks up /etc/systemd/system.conf.d changes without rebooting. Re-exec rather
# than reload: RuntimeWatchdogSec is read by the manager at startup.
- name: Re-execute systemd
  become: true
  ansible.builtin.systemd_service:
    daemon_reexec: true
