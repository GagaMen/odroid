- name: Reload systemd
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart journald
  become: true
  ansible.builtin.systemd_service:
    name: systemd-journald.service
    state: restarted

- name: Apply sysctls
  become: true
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Reconfigure multipathd
  become: true
  ansible.builtin.command: multipathd reconfigure
  changed_when: true
