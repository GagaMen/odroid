# Automatic reboot on a detected kernel deadlock.
#
# This vendor kernel ships without any lockup detector: CONFIG_DETECT_HUNG_TASK,
# CONFIG_SOFTLOCKUP_DETECTOR and CONFIG_PSI are all disabled. RCU stall detection
# is the only mechanism left (CONFIG_RCU_CPU_STALL_TIMEOUT=60), so panic_on_rcu_stall
# is the one sysctl that can notice a deadlock at all.
#
# It is not a substitute for a hardware watchdog: tasks blocked in uninterruptible
# sleep on dead storage yield the CPU and pass through quiescent states, so they do
# not necessarily produce a stall. See the watchdog section in this directory's
# README for the mechanism that covers that case.
kernel.panic_on_rcu_stall = 1

# Reboot 10s after a panic instead of sitting at the trace forever.
# This matches the kernel default here, pinned so it survives a kernel change.
kernel.panic = 10
