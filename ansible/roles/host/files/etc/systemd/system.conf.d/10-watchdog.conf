[Manager]
# Feed the hardware watchdog enabled by the device tree overlay, so the board
# resets itself when the system stops making progress.
#
# This is the only self-heal mechanism available here: the kernel ships without
# CONFIG_DETECT_HUNG_TASK, CONFIG_SOFTLOCKUP_DETECTOR and PSI, and a task
# blocked in uninterruptible sleep on dead storage yields the CPU, so it need
# not raise an RCU stall either. A hardware watchdog does not depend on the
# kernel noticing anything.
#
# systemd pings at half this interval, so 120s means a ping every 60s and a
# reset 120s after the last one. Deliberately not tighter: a slower value only
# delays recovery, while too tight a value resets a machine that is merely busy.
#
# The driver clamps this to its own maximum. Check what was actually applied:
#   journalctl -b | grep -i "watchdog"
RuntimeWatchdogSec=120

# Also arm the watchdog while shutting down, so a hang during shutdown does not
# leave the board wedged with no way back.
RebootWatchdogSec=10min
