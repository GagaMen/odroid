[Service]
# systemd 245 (Hardkernel PPA, pinned against Ubuntu's 255.4 via an epoch) does not
# know the faccessat2 syscall (439 on arm64) and omits it from @system-service.
# glibc 2.39 from Ubuntu 24.04 uses it -> seccomp kills the service with SIGSYS.
#
# Without this drop-in rsyslog dies on every boot and /var/log/syslog and
# /var/log/kern.log stay 0 bytes.
#
# SystemCallFilter is additive - this entry extends the existing allowlist.
SystemCallFilter=faccessat2
