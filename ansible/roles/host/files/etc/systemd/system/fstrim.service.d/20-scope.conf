[Service]
# The stock unit runs:
#   fstrim --listed-in /etc/fstab:/proc/self/mountinfo --verbose --quiet-unsupported
#
# Reading /proc/self/mountinfo means every mounted filesystem is trimmed, including
# volumes provided by a CSI driver over iSCSI. Those advertise discard support, so
# fstrim happily sends discards down the iSCSI path into the storage engine.
#
# Restrict this to the machine's own devices. Distributed volumes are trimmed
# through their own storage layer, which understands the replication underneath.
ExecStart=
ExecStart=/sbin/fstrim --verbose --quiet-unsupported /
ExecStart=/sbin/fstrim --verbose --quiet-unsupported /mnt/data
