- name: Make zsh the login shell
  become: true
  ansible.builtin.user:
    name: "{{ shell_user }}"
    shell: /bin/zsh

- name: Install Oh My Zsh
  ansible.builtin.git:
    repo: https://github.com/ohmyzsh/ohmyzsh.git
    dest: "{{ shell_home }}/.oh-my-zsh"
    version: "{{ shell_omz_version }}"
    update: false

- name: Install Powerlevel10k
  ansible.builtin.git:
    repo: https://github.com/romkatv/powerlevel10k.git
    dest: "{{ shell_home }}/.oh-my-zsh/custom/themes/powerlevel10k"
    version: "{{ shell_p10k_version }}"
    update: false

- name: Write ~/.zshrc
  ansible.builtin.template:
    src: zshrc.j2
    dest: "{{ shell_home }}/.zshrc"
    mode: "0644"

# Generated by "p10k configure"; rerun the wizard and copy the result back here to change it.
- name: Write ~/.p10k.zsh
  ansible.builtin.copy:
    src: p10k.zsh
    dest: "{{ shell_home }}/.p10k.zsh"
    mode: "0644"
