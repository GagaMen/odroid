# n and Claude Code only fill a gap and update themselves afterwards. Node.js follows the
# version package.json requires.

# Any existing n counts, including the symlink "npm install -g n" leaves behind.
- name: Check for n
  ansible.builtin.stat:
    path: /usr/local/bin/n
    follow: false
  register: devtools_n

- name: Install n
  become: true
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/tj/n/{{ devtools_n_version }}/bin/n"
    dest: /usr/local/bin/n
    mode: "0755"
  when: not devtools_n.stat.exists

- name: Read the installed Node.js version
  ansible.builtin.command: /usr/local/bin/node --version
  register: devtools_node
  check_mode: false
  changed_when: false
  failed_when: false

# Follows package.json: a bumped engines.node is installed on the next run.
- name: Install Node.js {{ devtools_node_version }}
  become: true
  ansible.builtin.command: n {{ devtools_node_version }}
  environment:
    PATH: "/usr/local/bin:{{ ansible_facts['env'].PATH }}"
  when: devtools_node.stdout | default('') != 'v' ~ devtools_node_version
  changed_when: true

# The official installer puts Claude Code under ~/.local and keeps it updated from there.
- name: Install Claude Code
  ansible.builtin.shell:
    cmd: set -o pipefail && curl -fsSL https://claude.ai/install.sh | bash
    executable: /bin/bash
    creates: "{{ ansible_facts['user_dir'] }}/.local/bin/claude"
  when: devtools_claude_code

# The private key is not the playbook's business: scripts/personal-files pull writes it from
# the vault. Pinned host keys spare the first push the interactive fingerprint prompt.
- name: Create ~/.ssh
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.ssh"
    state: directory
    mode: "0700"

- name: Trust GitHub's SSH host keys
  ansible.builtin.known_hosts:
    name: github.com
    key: "github.com {{ item }}"
    path: "{{ ansible_facts['user_dir'] }}/.ssh/known_hosts"
  loop: "{{ devtools_github_host_keys }}"
  loop_control:
    label: "{{ item.split()[0] }}"

- name: Set the git identity
  community.general.git_config:
    scope: global
    name: "user.{{ item.key }}"
    value: "{{ item.value }}"
  loop:
    - { key: name, value: "{{ devtools_git_user_name }}" }
    - { key: email, value: "{{ devtools_git_user_email }}" }
  loop_control:
    label: "user.{{ item.key }}"
  when: item.value | length > 0

- name: Read the repository's origin URL
  community.general.git_config_info:
    scope: local
    path: "{{ playbook_dir }}/.."
    name: remote.origin.url
  register: devtools_origin
  when: devtools_git_ssh_push

- name: Push to GitHub over SSH
  community.general.git_config:
    scope: local
    repo: "{{ playbook_dir }}/.."
    name: remote.origin.pushurl
    value: "{{ devtools_origin.config_value | regex_replace('^https://github\\.com/', 'git@github.com:') }}"
  when:
    - devtools_git_ssh_push
    - devtools_origin.config_value | default('') is match('https://github\\.com/')
