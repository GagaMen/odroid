tools_bin_dir: /usr/local/bin

# Pinned by hand: Dependabot does not see these. velero should match the server version the
# velero chart deploys.
tools_k9s_version: v0.51.0
tools_velero_version: v1.18.2

tools_releases:
  - name: k9s
    version: "{{ tools_k9s_version }}"
    version_args: [version, -s]
    url: "https://github.com/derailed/k9s/releases/download/{{ tools_k9s_version }}/k9s_Linux_arm64.tar.gz"
    checksums: "https://github.com/derailed/k9s/releases/download/{{ tools_k9s_version }}/checksums.sha256"
    member: k9s
  - name: velero
    version: "{{ tools_velero_version }}"
    version_args: [version, --client-only]
    url: "https://github.com/vmware-tanzu/velero/releases/download/{{ tools_velero_version }}/velero-{{ tools_velero_version }}-linux-arm64.tar.gz"
    checksums: "https://github.com/vmware-tanzu/velero/releases/download/{{ tools_velero_version }}/CHECKSUM"
    member: "velero-{{ tools_velero_version }}-linux-arm64/velero"

tools_k9s_config_dir: "{{ ansible_facts['user_dir'] }}/.config/k9s"
