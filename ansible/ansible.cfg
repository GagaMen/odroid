[defaults]
inventory            = inventory.yml
roles_path           = roles
stdout_callback      = yaml
bin_ansible_callbacks = true
interpreter_python   = auto_silent
retry_files_enabled  = false
nocows               = true
# Facts are gathered once per run and reused by every role.
gathering            = smart

# The vault lives outside this repository, so its password cannot live in here
# either. Pass it per run with --ask-vault-pass, or point this at a file that
# sits outside the working tree:
#   export ANSIBLE_VAULT_PASSWORD_FILE=~/.odroid-secrets/vault-pass

[privilege_escalation]
# Escalation is declared per play, not globally: capture.yml reads most of its
# state unprivileged and should not run as root by accident.
become      = false
become_ask_pass = false
