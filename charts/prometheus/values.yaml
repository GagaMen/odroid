# yaml-language-server: $schema=values.schema.json
# Default values for the prometheus chart wrapper.
# Real credentials and host overrides go into platform/values.yaml (gitignored).

prometheus:
  # -- Prometheus server retention period
  server:
    retention: 15d
    # Deletes the oldest blocks before the volume fills up. A full volume stops
    # Prometheus from writing anything at all, which is far worse than losing
    # the oldest days early.
    retentionSize: 16GB
    persistentVolume:
      enabled: true
      size: 20Gi
      storageClass: longhorn

  # -- Disable Alertmanager (we use Grafana Alerting instead)
  alertmanager:
    enabled: false

  # -- node-exporter: collect host-level metrics
  prometheus-node-exporter:
    enabled: true
    extraArgs:
      # Surfaces failed units as node_systemd_unit_state{state="failed"}, so a
      # service that dies silently is visible instead of going unnoticed.
      - --collector.systemd
      # Reads the *.prom files written by the node-exporter-textfile timer.
      - --collector.textfile.directory=/host/textfile
    extraHostVolumeMounts:
      - name: textfile
        hostPath: /var/lib/prometheus/node-exporter
        mountPath: /host/textfile
        readOnly: true
      # The systemd collector reaches systemd over the D-Bus system bus, which a
      # container does not otherwise see. node_exporter dials the path below
      # literally, and the image has no /var/run, so the mount has to land there
      # rather than on /run. The host path is given unresolved because /var/run
      # is itself a symlink to /run.
      #
      # The pod runs as uid 65534, so systemd answers read-only queries over the
      # bus and refuses anything else. readOnly is safe here: the kernel exempts
      # sockets from the read-only mount check, so connect() still succeeds.
      - name: dbus
        hostPath: /run/dbus/system_bus_socket
        mountPath: /var/run/dbus/system_bus_socket
        readOnly: true

  # -- kube-state-metrics: collect Kubernetes object metrics
  kube-state-metrics:
    enabled: true

  # -- pushgateway not needed for a home server
  prometheus-pushgateway:
    enabled: false
