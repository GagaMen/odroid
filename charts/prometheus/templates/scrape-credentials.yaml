{{- with .Values.scrapeCredentials }}
apiVersion: v1
kind: Secret
metadata:
  name: prometheus-scrape-credentials
  # Next to the Prometheus server, which mounts it. The upstream chart places
  # the server with forceNamespace, not namespaceOverride, and falls back to
  # the release namespace.
  namespace: {{ $.Values.prometheus.forceNamespace | default $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
type: Opaque
stringData:
  {{- range $name, $token := . }}
  {{ $name }}: {{ $token | quote }}
  {{- end }}
{{- end }}
