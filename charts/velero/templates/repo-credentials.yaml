{{- /*
Velero creates this secret itself with a well-known default password if it is
missing, and the password of a Kopia repository cannot be changed later. So it
has to exist before the first backup, and it must survive an uninstall: without
it every backup in both targets is unreadable.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: velero-repo-credentials
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/name: velero
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  repository-password: {{ required "repositoryPassword is required: set it before the first backup and keep a copy outside the cluster" .Values.repositoryPassword | quote }}
