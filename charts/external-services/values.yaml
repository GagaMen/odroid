# yaml-language-server: $schema=values.schema.json
# Default values for external-services.
# Each entry in services gets a Service without selector, an EndpointSlice with
# the device's addresses and an Ingress with a certificate for its host.

# Override the deployment namespace
namespaceOverride: ""

# Applies to the Ingress of every entry.
ingress:
  className: ""
  # Shared annotations, e.g. the cert-manager issuer and a source whitelist.
  # An entry's own annotations are merged over these.
  annotations: {}
  # Add a TLS section per host; the certificate lands in the secret "<name>-tls".
  tls: true

services: []
