# yaml-language-server: $schema=values.schema.json
# Default values for the loki chart wrapper.
# Real credentials and host overrides go into platform/values.yaml (gitignored).

loki:
  # Deploy Loki in single-binary mode – suited for a single-node home server.
  deploymentMode: SingleBinary

  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    pattern_ingester:
      enabled: true
    limits_config:
      allow_structured_metadata: true
      volume_enabled: true
    rulerConfig:
      enable_api: true

  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 10Gi
      storageClass: longhorn

  # Disable minio (we use filesystem storage)
  minio:
    enabled: false

  # Disable components not needed in single-binary mode
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0
  ingester:
    replicas: 0
  querier:
    replicas: 0
  queryFrontend:
    replicas: 0
  queryScheduler:
    replicas: 0
  distributor:
    replicas: 0
  compactor:
    replicas: 0
  indexGateway:
    replicas: 0
  bloomPlanner:
    replicas: 0
  bloomBuilder:
    replicas: 0
  bloomGateway:
    replicas: 0

  # Disable external Memcached caches – not needed for a single-node home server.
  # Loki falls back to its built-in in-memory cache.
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false

  # Disable the nginx gateway – Loki is accessed directly within the cluster
  gateway:
    enabled: false

  # The rules sidecar (k8s-sidecar 2.x) runs on Python 3.15, whose OpenSSL insists
  # that a CA certificate carry a Key Usage extension. The CA MicroK8s generates
  # does not, so the sidecar cannot reach the API server and the loki pod never
  # turns ready. This relaxes the strict X.509 extension checks; certificate
  # verification itself stays on, unlike sidecar.skipTlsVerify.
  sidecar:
    disableX509StrictVerification: true
