{{- if .Values.bring.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mealie.fullname" . }}
  namespace: {{ include "mealie.namespace" . }}
  labels:
    {{- include "mealie.labels" . | nindent 4 }}
type: Opaque
stringData:
  BRING_USERNAME: {{ required "bring.username is required with bring.enabled" .Values.bring.username | quote }}
  BRING_PASSWORD: {{ required "bring.password is required with bring.enabled" .Values.bring.password | quote }}
  {{- with .Values.bring.mealieApiKey }}
  MEALIE_API_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
