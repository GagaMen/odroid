apiVersion: v1
kind: Secret
metadata:
  name: {{ include "paperless.fullname" . }}
  namespace: {{ include "paperless.namespace" . }}
  labels:
    {{- include "paperless.labels" . | nindent 4 }}
type: Opaque
stringData:
  PAPERLESS_SECRET_KEY: {{ required "secret.secretKey is required" .Values.secret.secretKey | quote }}
  {{- if .Values.secret.adminUser }}
  PAPERLESS_ADMIN_USER: {{ .Values.secret.adminUser | quote }}
  PAPERLESS_ADMIN_PASSWORD: {{ required "secret.adminPassword is required with secret.adminUser" .Values.secret.adminPassword | quote }}
  {{- end }}
  {{- if .Values.scanShare.enabled }}
  {{- $password := required "scanShare.password is required with scanShare.enabled" .Values.scanShare.password }}
  {{- if contains " " $password }}
  {{- fail "scanShare.password must not contain spaces" }}
  {{- end }}
  ACCOUNT_{{ .Values.scanShare.user }}: {{ $password | quote }}
  {{- end }}
