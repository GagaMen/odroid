# Provisioned by the platform chart. Managed here, read-only in the Grafana UI.
# Edit this file and run helm upgrade.
apiVersion: 1
groups:
- orgId: 1
  name: Every 5 minutes
  folder: Infrastructure
  interval: 5m
  rules:
  - uid: cfx2axpsmv4sgc
    title: Odroid | Fehlgeschlagene systemd-Units
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        editorMode: code
        expr: node_systemd_unit_state{state="failed"} == 1
        instant: true
        intervalMs: 1000
        legendFormat: __auto
        maxDataPoints: 43200
        range: false
        refId: A
    - refId: C
      datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 0
            type: gt
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: C
        type: threshold
    noDataState: OK
    execErrState: Error
    for: 5m
    annotations:
      summary: '⚠️ Mindestens eine systemd-Unit ist fehlgeschlagen

        Betroffen: {{ $labels.name }}'
    labels:
      priority: '3'
    isPaused: false
    notification_settings:
      receiver: Ntfy
  - uid: bfx2axqi3bvnkb
    title: Odroid | Watchdog nicht aktiv
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        editorMode: code
        expr: node_watchdog_present
        instant: true
        intervalMs: 1000
        legendFormat: __auto
        maxDataPoints: 43200
        range: false
        refId: A
    - refId: C
      datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 1
            type: lt
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: C
        type: threshold
    noDataState: NoData
    execErrState: Error
    for: 10m
    annotations:
      summary: '🐕 Kein Hardware-Watchdog aktiv — die Selbstheilung greift nicht.

        Nach einem Kernel-Update muss das Device-Tree-Overlay neu abgelegt werden.

        (Regel ist bis zur Watchdog-Einrichtung pausiert.)'
    labels:
      priority: '4'
    isPaused: true
    notification_settings:
      receiver: Ntfy
  - uid: dfx2axr8b9ibkd
    title: Odroid | Metriken fehlen
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        editorMode: code
        expr: absent(node_boot_time_seconds)
        instant: true
        intervalMs: 1000
        legendFormat: __auto
        maxDataPoints: 43200
        range: false
        refId: A
    - refId: C
      datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 0
            type: gt
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: C
        type: threshold
    noDataState: OK
    execErrState: Error
    for: 5m
    annotations:
      summary: 🚨 Der node-exporter liefert keine Daten mehr — das Monitoring ist blind.
    labels:
      priority: '5'
    isPaused: false
    notification_settings:
