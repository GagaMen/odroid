        to: 0
      datasourceUid: prometheus
      model:
        editorMode: code
        expr: sum(rate(nft_counter_packets{job="flint",name="wan_dropped"}[15m])) / sum(rate(nft_counter_packets{job="flint",name="wan_dropped"}[7d])) and sum(rate(nft_counter_packets{job="flint",name="wan_dropped"}[15m])) > 1
        instant: true
        intervalMs: 1000
        legendFormat: __auto
        maxDataPoints: 43200
        range: false
        refId: A
    - refId: C
      datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 10
            type: gt
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: C
        type: threshold
    noDataState: OK
    execErrState: Error
    for: 15m
