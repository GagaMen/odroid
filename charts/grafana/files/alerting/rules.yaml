        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        editorMode: code
        expr: time() - node_boot_time_seconds{app_kubernetes_io_name="prometheus-node-exporter"}
        instant: true
        intervalMs: 1000
        legendFormat: __auto
        maxDataPoints: 43200
        range: false
        refId: A
    - refId: C
      datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 3600
            type: lt
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: C
        type: threshold
    noDataState: NoData
    execErrState: Error
    annotations:
      summary: 🔄 Der Server wurde neu gestartet\nBoot liegt {{ $values.A }} Sekunden zurück
    labels:
      priority: '4'
    isPaused: false
    notification_settings:
      receiver: Ntfy
  - uid: cfgpcf90dv9q8e
    title: Odroid | CPU-Auslastung zu hoch
    condition: B
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        editorMode: builder
        expr: 100 - (avg(rate(node_cpu_seconds_total{app_kubernetes_io_name="prometheus-node-exporter",mode="idle"}[5m])) * 100)
        instant: true
        intervalMs: 1000
        legendFormat: __auto
        maxDataPoints: 43200
        range: false
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 85
            type: gt
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        type: threshold
    noDataState: NoData
    execErrState: Error
    for: 5m
    annotations:
      summary: '🔥 CPU-Last auf dem Odroid Server seit 5min über 85%\nAktuell: {{ $values.A }}%'
    labels:
      priority: '3'
    isPaused: false
    notification_settings:
      receiver: Ntfy
  - uid: ffgsqzwxyg4cgb
    title: Odroid | RAM-Auslastung zu hoch
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        editorMode: code
        expr: 100 * (1 - (node_memory_MemAvailable_bytes{app_kubernetes_io_name="prometheus-node-exporter"} / node_memory_MemTotal_bytes{app_kubernetes_io_name="prometheus-node-exporter"}))
        instant: true
        intervalMs: 1000
        legendFormat: __auto
        maxDataPoints: 43200
        range: false
        refId: A
    - refId: C
      datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 90
            type: gt
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: C
        type: threshold
    noDataState: NoData
    execErrState: Error
    for: 3m
    annotations:
      summary: '🚨 RAM auf dem Odroid Server seit 3min über 90%\nAktuell: {{ $values.A }}% belegt'
    labels:
      priority: '4'
    isPaused: false
    notification_settings:
      receiver: Ntfy
  - uid: afgt7koy2pkw0a
    title: Odroid | CPU-Temparatur zu hoch
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        editorMode: builder
        expr: max(node_hwmon_temp_celsius{app_kubernetes_io_name="prometheus-node-exporter",chip=~".*thermal.*", sensor="temp1"})
        instant: true
        intervalMs: 1000
        legendFormat: __auto
        maxDataPoints: 43200
        range: false
        refId: A
    - refId: C
      datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 75
            type: gt
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: C
        type: threshold
    noDataState: NoData
    execErrState: Error
    for: 2m
    annotations:
      summary: '💀 Die CPU-Temparatur ist auf über 75° gestiegen\nAktuell: {{ $values.A }}°'
    labels:
      priority: '5'
    isPaused: false
    notification_settings:
      receiver: Ntfy
  - uid: ryqpr1cse0xbed
    title: Prometheus | Speichert keine Messwerte
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        editorMode: code
        expr: count(up == 1)
        instant: true
        intervalMs: 1000
        legendFormat: __auto
        maxDataPoints: 43200
        range: false
        refId: A
    - refId: C
      datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 1
            type: lt
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: C
        type: threshold
    noDataState: Alerting
    execErrState: Alerting
    for: 5m
    annotations:
      summary: '🚨 Prometheus liefert keine aktuellen Messwerte mehr.\nAlle anderen Regeln sind damit blind. Erste Prüfung: df -h /data im Prometheus-Pod und kubectl logs -n monitoring deploy/platform-prometheus-server'
    labels:
      priority: '5'
    isPaused: false
    notification_settings:
      receiver: Ntfy
  - uid: fm6v3wnhkmjuiu
    title: Prometheus | TSDB-Wartung schlägt fehl
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        editorMode: code
        expr: sum(increase(prometheus_tsdb_compactions_failed_total[3h])) + sum(increase(prometheus_tsdb_wal_truncations_failed_total[3h])) + sum(increase(prometheus_tsdb_checkpoint_creations_failed_total[3h])) + sum(increase(prometheus_tsdb_wal_corruptions_total[3h]))
        instant: true
        intervalMs: 1000
        legendFormat: __auto
        maxDataPoints: 43200
        range: false
        refId: A
    - refId: C
      datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 0
            type: gt
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: C
        type: threshold
    noDataState: OK
    execErrState: Error
    for: 0m
    annotations:
      summary: '⚠️ Prometheus kann seine TSDB nicht mehr kompaktieren oder das WAL nicht kürzen.\nUnbehoben läuft das Volume voll. Details im Log: kubectl logs -n monitoring deploy/platform-prometheus-server -c prometheus-server, nach compaction, checkpoint oder corruption suchen'
    labels:
      priority: '4'
    isPaused: false
    notification_settings:
      receiver: Ntfy
