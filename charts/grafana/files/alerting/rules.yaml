      summary: '🛡️ Der Flint verwirft gerade {{ $values.A }}-mal so viele Pakete aus dem Internet wie im 7-Tage-Schnitt.\nDie Firewall hält sie ab; das ist ein Hinweis, kein Einbruch. Die Quell-IPs stehen in Grafana Explore: Loki, job = syslog, app = kernel, nach reject wan in filtern'
