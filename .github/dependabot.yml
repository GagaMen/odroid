# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

# Dependabot's network proxy lets update jobs reach only an allowlist of hosts:
# well-known public registries, ghcr.io among them. A Helm chart repository
# outside that list answers 403, the version lookup comes back empty, and
# Dependabot closes open pull requests as "update no longer possible" without
# reporting an error. Charts are therefore pulled from ghcr.io wherever the
# project publishes there.
#
# Longhorn, MetalLB and RustFS publish only to classic HTTP repositories that
# are not on the allowlist, so Dependabot does not detect their updates.
# Declaring them under `registries` would add them to the allowlist, but
# GitHub rejects a helm-registry without credentials, even for a public
# repository.
#
# Every ecosystem runs monthly, which Dependabot schedules on the first day of
# the month (`day` applies only to weekly updates); `time` is UTC. Two kinds of
# run happen outside that schedule: pushing a change to this file to the
# default branch starts a run for every entry, and security updates open as
# soon as an advisory is published.
updates:
  - package-ecosystem: "docker"
    directories:
      - /charts/actual
      - /charts/adguard
      - /charts/cert-manager-dns-lexicon-webhook
      - /charts/homepage
      - /charts/ntfy
      - /charts/paperless
      - /charts/rustfs
      - /charts/velero
    schedule:
      interval: "monthly"
      time: "20:00"
    assignees:
      - GagaMen
  - package-ecosystem: "helm"
    directories:
      - /charts/alloy
      - /charts/blackbox-exporter
      - /charts/grafana
      - /charts/loki
      - /charts/longhorn
      - /charts/metallb
      - /charts/prometheus
      - /charts/rustfs
      - /charts/snapshot-controller
      - /charts/velero
    schedule:
      interval: "monthly"
      time: "20:00"
    assignees:
      - GagaMen
  # Dev tooling, among it the Bitwarden CLI that reads the platform's secrets
  # at deploy time.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "20:00"
    assignees:
      - GagaMen
    ignore:
      # TypeScript is pinned for ts-json-schema-generator, which requires
      # ^5.9.3 and uses the compiler API. A TypeScript 7 at the root would
      # leave the generator on its own nested 5.x and the pin without effect.
      # Drop this once the generator supports TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
